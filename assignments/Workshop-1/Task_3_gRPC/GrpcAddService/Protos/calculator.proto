syntax = "proto3";

option csharp_namespace = "GrpcAddService";

package calculator;

// The Calculator service definition.
service CalculatorGrpc {
  // Add two numbers
  rpc Add (AddRequest) returns (AddResponse);
}

message AddRequest {
  int32 number1 = 1;
  int32 number2 = 2;
}

message AddResponse {
  int32 result = 1;
}